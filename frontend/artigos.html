<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BioHub: artigos científicos, notícias e encontros da Liga Acadêmica de Biotecnologia da UniALFA">
    <title>BioHub - Liga Acadêmica de Biotecnologia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


    
    


    <link rel="stylesheet" href="css/style.css">
</head>


<body>


    <header class="cabecalho">
        <a href="index.html" class="logo" aria-label="BioHub, ir para o início">
            <img src="img/Logo Oficial - BioHub.jpeg" alt="" class="logo-img">
            <span class="logo-nome">BioHub</span>
        </a>

        <nav class="menu" aria-label="Menu principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="noticias.html">Notícias</a></li>
                <li><a href="artigos.html"  aria-current="page">Artigos</a></li>
                <li><a href="encontros.html">Encontros</a></li>

                
            </ul>
        </nav>

        <a href="area-da-liga.html" class="botao-area-liga">Área da Liga &rarr;</a>

    </header>

    <main class="main_artigo">

        
        

            <div class="cabecalho-secao">
                <div>
                    <p class="sobretitulo">Produção científica</p>
                    <h2 id="titulo-artigos">Artigos</h2>
                </div>
            </div>
            
            <form class="pesquisa" role="search" id="form-pesquisa">
                
                <input type="search" id="titulo_pesquisa" class="pesquisa-campo" placeholder="Pesquisar artigos..." autocomplete="off">
                
                <button type="submit" class="pesquisa-botao" id="pesquisar" aria-label="Pesquisar">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                    </svg>
                </button>
                
                
            </form>
            
            
        


        <div class="main_div">
            <section class="artigos" id="lista-artigos">
                
                <a href="" class="cartao-artigo-link">
                    <div class="cartao-artigo-capa">
                                        <img src="" alt="....">                
                    </div>
                    <div class="cartao-artigo-info">

                        <div>
                            <h3>Nenhum artigo encontrado</h3>
                            <p></p>
                            <p class="cartao-artigo-autor"></p>
                            <p class="cartao-artigo-meta">
                                <span></span>
                                <time datetime=""></time>
                            </p>
                        </div>
                    </div>
                </a>
            </section>
        </div>



        <form id="teste_filros">
           <label><input class="sereia" type="checkbox" >Genética</label>
            <label><input class="elefante" type="checkbox">Meio ambiente</label>
            <label><input class="peixe" type="checkbox">Oncologia</label>
        </form>


        


        <!-- Div teporaria para os botoes que adcionam artigos-->
        <div class="teste">
            <form id="campos_teste">
                <input id="titulo_input" placeholder="titulo">
                <input id="subtitulo_input" placeholder="subtitulo">
                <input id="img_input" placeholder="imagem">
                <input id="link_input" placeholder="link de destino">
            </form>
            <button type="button" id="teste_button">Enviar ao Banco</button>    
        </div>

        







        <script type="module" src="js/main.js" defer></script>
    </main>

    <footer class="rodape">
            <div class="rodape-marca">
                <img src="img/Logo Oficial - BioHub.jpeg" alt="Logo da Liga Acadêmica de Biotecnologia" class="rodape-logo">
                <div>
                    <p class="rodape-titulo">BioHub</p>
                    <p>Liga Acadêmica de Biotecnologia &middot; UniAlfa</p>
                    <p>email-exemplo@biohub.com &middot; @lab-unialfa</p>
                </div>
            </div>

            <p class="direitos">&copy; 2026 Projeto BioHub &middot; Todos os Direitos Reservados</p>
    </footer>

</body>
</html>
